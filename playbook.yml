- name: Setup
  hosts: localhost
  tasks:
    - name: Configure fish shell
      block:
        - name: Install fish
          community.general.homebrew:
            name: fish
        - name: Set fish shell
          become: true
          ansible.builtin.user:
            name: "{{ ansible_user_id }}"
            shell: /opt/homebrew/bin/fish
        - name: Create fish directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/fish
            state: directory
        - name: Add Homebrew to PATH
          ansible.builtin.blockinfile:
            block: |
              eval "$(/opt/homebrew/bin/brew shellenv)"
              starship init fish | source
            create: true
            mode: u=rw,g=r,o=r
            path: ~/.config/fish/config.fish

    - name: Install Homebrew packages
      block:
        - name: Create .homebrew directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.homebrew
            state: directory
        - name: Copy Brewfile
          ansible.builtin.copy:
            dest: ~/.homebrew/Brewfile
            mode: u=rw,g=r,o=r
            src: ./dotfiles/Brewfile
        - name: Install Homebrew packages
          ansible.builtin.command:
            cmd: brew bundle install --global --no-upgrade
          register: brew_bundle_install
          changed_when: "'Installing' in brew_bundle_install.stdout"

    - name: Install tools via mise
      block:
        - name: Create mise directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/mise
            state: directory
        - name: Copy mise global config
          ansible.builtin.copy:
            dest: ~/.config/mise/config.toml
            mode: u=rw,g=r,o=r
            src: ./dotfiles/mise-global.toml
        - name: Install tools via mise
          ansible.builtin.command:
            cmd: mise install
          register: mise_install
          changed_when: "'all tools are installed' not in mise_install.stderr"

    - name: Install skills via apm
      block:
        - name: Create apm directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.apm
            state: directory
        - name: Copy apm global config
          ansible.builtin.copy:
            dest: ~/.apm/apm.yml
            mode: u=rw,g=r,o=r
            src: ./dotfiles/apm.yml
        - name: Install skills via apm
          ansible.builtin.command:
            cmd: mise exec -- apm install --global
          changed_when: false

    - name: Configure ponytail
      block:
        - name: Create ponytail config directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/ponytail
            state: directory
        - name: Copy ponytail config
          ansible.builtin.copy:
            dest: ~/.config/ponytail/config.json
            mode: u=rw,g=r,o=r
            src: ./dotfiles/ponytail.json

    - name: Configure caveman
      block:
        - name: Create caveman config directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/caveman
            state: directory
        - name: Copy caveman config
          ansible.builtin.copy:
            dest: ~/.config/caveman/config.json
            mode: u=rw,g=r,o=r
            src: ./dotfiles/caveman.json
        # Workaround: put SKILL.md where caveman's hook looks for it. Both
        # tasks below exist only for this; delete them together once the
        # "Remove" condition is met.
        #
        # apm installs one package into two folders, split by file type:
        #   ~/.claude/hooks/caveman/   <- caveman-activate.js, run each session
        #   ~/.claude/skills/caveman/  <- SKILL.md, the rules it must read
        # The hook is registered in settings.json as
        #   node "${CLAUDE_PLUGIN_ROOT}/src/hooks/caveman-activate.js"
        # and apm substitutes the hooks folder for that placeholder. The script
        # then resolves SKILL.md relative to it, so it looks in
        #   ~/.claude/hooks/caveman/skills/caveman/SKILL.md   <- nothing here
        # The link below makes that path land on the real skills folder.
        # caveman itself is not patched.
        #
        # Nothing warns you when the link is missing. The failed read is caught
        # and the script prints a hardcoded fallback ruleset instead, so
        # caveman still activates -- with the wrong rules. The header line is
        # no help either: it reports the mode from ~/.config/caveman/config.json,
        # a read that always succeeds, so it looks right in both cases. Only
        # the body of the output differs, hence:
        #
        # Check:  node ~/.claude/hooks/caveman/src/hooks/caveman-activate.js \
        #           | grep -c '## Intensity'
        #         1 = real SKILL.md loaded, nothing to do.
        #         0 = fallback: the link is missing or dangling. Re-run this
        #             play and check again; if it still prints 0, the paths
        #             above have moved -- see "Remove".
        #         ('## Intensity' appears in the real file for every mode, and
        #          never in the fallback.)
        # Remove: once apm substitutes a folder that contains skills/, or the
        #         hook also searches ~/.claude/skills/. It already tries three
        #         candidate paths (see the comment above `skillCandidates` in
        #         caveman-activate.js) -- none of them reaches apm's split
        #         layout, which is exactly what this link bridges.
        # Verified 2026-07-26 against apm 0.26.0: still needed, still works.
        # apm exposes no setting for the substituted root. The link survives
        # `apm install`.
        - name: Create caveman hooks skills directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.claude/hooks/caveman/skills
            state: directory
        - name: Link caveman skill into hook's search path
          ansible.builtin.file:
            src: ~/.claude/skills/caveman
            dest: ~/.claude/hooks/caveman/skills/caveman
            # No force: true, on purpose -- it is the reflex fix when a link
            # task fails, and here it would hide the signal you want.
            #
            # Without it the task still self-heals the cases that matter: a
            # missing dest, or a symlink that dangles or points elsewhere, is
            # replaced. It fails only when something real sits at dest ("refusing
            # to convert from directory to symlink"), which means apm or caveman
            # started shipping files there -- the "Remove" condition above. That
            # failure is how you find out.
            #
            # force would convert an *empty* directory by deleting it, quietly
            # reapplying this workaround on top of the upstream fix. (A non-empty
            # one fails either way: "the directory ... is not empty, refusing to
            # convert it".)
            state: link

    - name: Configure macOS defaults
      block:
        - name: Tap to click
          community.general.osx_defaults:
            domain: com.apple.AppleMultitouchTrackpad
            key: Clicking
            type: int
            value: 1

        - name: Automatically hide and show the Dock
          community.general.osx_defaults:
            domain: com.apple.dock
            key: autohide
            type: bool
            value: true
        - name: Show suggested and recent apps in Dock
          community.general.osx_defaults:
            domain: com.apple.dock
            key: show-recents
            type: bool
            value: false

        - name: Automatically hide the menu bar
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: _HIHideMenuBar
            type: bool
            value: true
        - name: Show all filename extensions
          community.general.osx_defaults:
            domain: NSGlobalDomain
            key: AppleShowAllExtensions
            type: bool
            value: true
        - name: Show path bar
          community.general.osx_defaults:
            domain: com.apple.finder
            key: ShowPathbar
            type: bool
            value: true

        - name: Show battery percentage in the menu bar
          community.general.osx_defaults:
            domain: com.apple.controlcenter
            host: currentHost
            key: BatteryShowPercentage
            type: bool
            value: true

    - name: Configure Git and SSH
      block:
        - name: Generate SSH key
          community.crypto.openssh_keypair:
            path: ~/.ssh/id_ed25519
            type: ed25519

        - name: Configure ~/.gitconfig
          community.general.git_config:
            name: "{{ item.name }}"
            scope: global
            value: "{{ item.value }}"
          loop:
            - name: user.name
              value: "Bastien Sun"
            - name: user.email
              value: "43788700+bastiensun@users.noreply.github.com"
            - name: core.editor
              value: "zed --wait"

            - name: gpg.format
              value: "ssh"
            - name: user.signingkey
              value: "~/.ssh/id_ed25519.pub"
            - name: commit.gpgsign
              value: "true"

    - name: Configure Ghostty
      block:
        - name: Create Ghostty directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/ghostty
            state: directory
        - name: Configure Ghostty
          ansible.builtin.blockinfile:
            block: |
              theme = dark:Catppuccin Mocha,light:Catppuccin Latte
            create: true
            mode: u=rw,g=r,o=r
            path: ~/.config/ghostty/config

    - name: Configure AeroSpace
      block:
        - name: Create AeroSpace directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/aerospace
            state: directory
        - name: Copy AeroSpace config
          ansible.builtin.copy:
            dest: ~/.config/aerospace/aerospace.toml
            mode: u=rw,g=r,o=r
            src: ./dotfiles/aerospace.toml

    - name: Configure simple-bar
      block:
        - name: Clone simple-bar
          ansible.builtin.git:
            repo: https://github.com/Jean-Tinland/simple-bar.git
            dest: "~/Library/Application Support/Übersicht/widgets/simple-bar"
            version: "HEAD" # noqa: latest
        - name: Copy simple-bar config
          ansible.builtin.copy:
            dest: ~/.simplebarrc
            mode: u=rw,g=r,o=r
            src: ./dotfiles/simple-bar.json

    - name: Configure Zed
      block:
        - name: Create Zed directory
          ansible.builtin.file:
            mode: u=rwx,g=rx,o=rx
            path: ~/.config/zed
            state: directory
        - name: Copy Zed config
          ansible.builtin.copy:
            dest: ~/.config/zed/settings.json
            mode: u=rw,g=r,o=r
            src: ./dotfiles/zed.json
