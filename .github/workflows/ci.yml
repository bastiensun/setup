name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_CONFIG_DIR: ${{ github.workspace }}

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: --force-dotfiles
          bootstrap_skip: user
          log_level: ${{ runner.debug && 'debug' || 'info' }}
      - name: Completeness check
        run: |
          mise bootstrap packages status --missing
          mise bootstrap repos status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap macos defaults status --missing
      - name: Login shell check
        run: mise bootstrap user status
      - name: Idempotence check
        run: |
          mise bootstrap --skip user
          mise bootstrap packages status --missing
          mise bootstrap repos status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap macos defaults status --missing
