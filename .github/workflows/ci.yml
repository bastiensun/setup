name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Runs every phase, including `user` (chsh sets the login shell).
      # chsh has no sudo path and no way to answer a password prompt here,
      # so this may hang or fail non-interactively on a fresh runner.
      # Previously this step skipped that phase with `bootstrap_skip: user`,
      # and the idempotence check below ran four per-part status commands
      # instead of one, because the aggregate command always reports
      # `user` as missing when that phase is skipped.
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          cache: false
          log_level: ${{ runner.debug && 'debug' || 'info' }}
      - name: Idempotence check
        run: mise bootstrap status --missing
      - name: Check AeroSpace was installed
        run: test -d /Applications/AeroSpace.app
      - name: Check the SSH key was generated
        run: test -f ~/.ssh/id_ed25519
