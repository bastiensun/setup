name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_skip: user
          cache: false
          log_level: ${{ runner.debug && 'debug' || 'info' }}
      - name: Idempotence check
        run: |
          mise bootstrap packages status --missing
          mise bootstrap repos status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap macos defaults status --missing
      - name: Check AeroSpace was installed
        run: |
          test -d /Applications/AeroSpace.app
      - name: Check the SSH key was generated
        run: |
          test -f ~/.ssh/id_ed25519
