name: New machine

on:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: macos-latest
    steps:
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Adopt the setup repository
        run: mise bootstrap --adopt bastiensun/setup --skip user --force-dotfiles
      - name: Completeness check
        run: |
          mise bootstrap packages status --missing
          mise bootstrap repos status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap macos defaults status --missing
      - name: Idempotence check
        run: |
          mise bootstrap --skip user
          mise bootstrap packages status --missing
          mise bootstrap repos status --missing
          mise bootstrap dotfiles status --missing
          mise bootstrap macos defaults status --missing
